---
- name: Lab 3 — Monitoring with Prometheus, Grafana, and cAdvisor
  hosts: all
  become: true

  vars:
    monitor_dir: /opt/monitoring
    grafana_user: admin
    grafana_password: adminpass
    grafana_port: 3000
    prometheus_port: 9090
    cadvisor_port: 8180
    grafana_dashboard_id: 193
    grafana_dashboard_json: /tmp/dashboard.json

  tasks:
    # 1. Установка Docker, как в ЛР2
    - name: Install required base packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present
        update_cache: yes

    - name: Install Docker CE and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - python3-pip
          - python3-docker
          - python3-requests
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    # 2. Monitoring stack
    - name: Ensure monitoring directory exists
      file:
        path: "{{ monitor_dir }}"
        state: directory
        mode: '0755'

    - name: Create Prometheus config file
      copy:
        dest: "{{ monitor_dir }}/prometheus.yml"
        mode: '0644'
        content: |
          global:
            scrape_interval: 10s
          scrape_configs:
            - job_name: 'cadvisor'
              static_configs:
                - targets: ['cadvisor:8080']

    - name: Create docker-compose file for monitoring stack
      copy:
        dest: "{{ monitor_dir }}/docker-compose.yml"
        mode: '0644'
        content: |
          version: '3.8'
          services:
            cadvisor:
              image: gcr.io/cadvisor/cadvisor:latest
              container_name: cadvisor
              restart: always
              ports:
                - "{{ cadvisor_port }}:8080"
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:rw
                - /sys:/sys:ro
                - /var/lib/docker/:/var/lib/docker:ro
              networks:
                - monitor_net

            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: always
              volumes:
                - "{{ monitor_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml"
              ports:
                - "{{ prometheus_port }}:9090"
              networks:
                - monitor_net

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              restart: always
              ports:
                - "{{ grafana_port }}:3000"
              environment:
                - GF_SECURITY_ADMIN_USER={{ grafana_user }}
                - GF_SECURITY_ADMIN_PASSWORD={{ grafana_password }}
              networks:
                - monitor_net

          networks:
            monitor_net:

    - name: Deploy monitoring stack using docker_compose_v2
      community.docker.docker_compose_v2:
        project_src: "{{ monitor_dir }}"
        state: present
        remove_orphans: true

    - name: Wait for Grafana to be ready
      uri:
        url: "http://localhost:{{ grafana_port }}"
        status_code: 200
        timeout: 30
      register: grafana_status
      retries: 10
      delay: 5
      until: grafana_status.status == 200

    # 3. Добавление Prometheus в Grafana
    - name: Add Prometheus as Grafana datasource
      community.grafana.grafana_datasource:
        name: DS_PROMETHEUS
        ds_type: prometheus
        ds_url: http://prometheus:9090
        access: proxy
        is_default: true
        state: present
        grafana_url: "http://localhost:{{ grafana_port }}"
        grafana_user: "{{ grafana_user }}"
        grafana_password: "{{ grafana_password }}"

    # 4. Дашборд Grafana
    - name: Download Grafana dashboard JSON
      get_url:
        url: "https://grafana.com/api/dashboards/{{ grafana_dashboard_id }}/revisions/1/download"
        dest: "{{ grafana_dashboard_json }}"
        mode: '0644'

    - name: Read dashboard content from file
      slurp:
        src: "{{ grafana_dashboard_json }}"
      register: dashboard_json

    - name: Import dashboard into Grafana
      uri:
        url: "http://localhost:{{ grafana_port }}/api/dashboards/import"
        method: POST
        user: "{{ grafana_user }}"
        password: "{{ grafana_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          dashboard: "{{ dashboard_json.content | b64decode | from_json }}"
          inputs:
            - name: "DS_PROMETHEUS"
              type: "datasource"
              pluginId: "prometheus"
              value: "DS_PROMETHEUS"
          overwrite: true

    - name: Final info message
      debug:
        msg: "Grafana доступна по адресу: http://{{ ansible_host }}:{{ grafana_port }}"
