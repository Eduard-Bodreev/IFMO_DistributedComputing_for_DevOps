---
- name: Cleanup test data on master and verify replica
  hosts: wordpress_server
  become: true

  vars:
    db_root_password: root_pass

  tasks:
    - name: Delete all data from test table on master
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ db_root_password }}"
        login_host: 127.0.0.1
        login_port: 3306
        query: DELETE FROM testdatab.test_table;

    - name: Wait for replication sync
      ansible.builtin.pause:
        seconds: 10

    - name: Query replica after deletion
      community.mysql.mysql_query:
        login_user: root
        login_password: "{{ db_root_password }}"
        login_host: 127.0.0.1
        login_port: 3307
        query: SELECT * FROM testdatab.test_table;
      register: replica_data_after_delete

    - name: Display data from replica after deletion
      ansible.builtin.debug:
        var: replica_data_after_delete.query_result