---
- name: Deploy Galera Cluster with HAProxy and Monitoring
  hosts: wordpress_server
  become: true

  vars:
    galera_nodes: ["db1", "db2", "db3", "db4", "db5"]
    galera_cluster_name: "my_galera_cluster"
    galera_root_password: root_pass
    galera_monitoring_user: monitor
    galera_monitoring_pass: monitorpass
    haproxy_port: 3307
    wordpress_port: 8080
    monitor_dir: /opt/monitoring
    galera_dir: /opt/galera
    haproxy_dir: /opt/haproxy

  tasks:
    - name: Ensure required directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ galera_dir }}"
        - "{{ haproxy_dir }}"

    - name: Deploy Galera docker-compose file
      template:
        src: docker-compose-galera.yml.j2
        dest: "{{ galera_dir }}/docker-compose.yml"

    - name: Deploy Galera configuration file
      copy:
        src: galera.cnf
        dest: "{{ galera_dir }}/galera.cnf"

    - name: Start Galera Cluster
      command: docker-compose up -d
      args:
        chdir: "{{ galera_dir }}"

    - name: Wait for Galera to become healthy
      community.docker.docker_container_info:
        name: "{{ item }}"
      register: galera_status
      until: galera_status.container.State.Health.Status == "healthy"
      retries: 10
      delay: 5
      loop: "{{ galera_nodes }}"

    - name: Deploy HAProxy docker-compose
      template:
        src: docker-compose-haproxy.yml.j2
        dest: "{{ haproxy_dir }}/docker-compose.yml"

    - name: Deploy HAProxy config
      copy:
        src: haproxy.cfg
        dest: "{{ haproxy_dir }}/haproxy.cfg"

    - name: Start HAProxy
      command: docker-compose up -d
      args:
        chdir: "{{ haproxy_dir }}"

    - name: Reconfigure WordPress to use HAProxy DB
      lineinfile:
        path: /opt/wordpress/docker-compose.yml
        regexp: 'WORDPRESS_DB_HOST.*'
        line: 'WORDPRESS_DB_HOST: haproxy:{{ haproxy_port }}'

    - name: Restart WordPress stack
      command: docker-compose up -d
      args:
        chdir: /opt/wordpress

    - name: Ensure monitoring (Prometheus + Grafana) is running
      include_tasks: playbook3.yml

    - name: Show success message
      debug:
        msg: "Galera Cluster with HAProxy and monitoring is deployed successfully."
